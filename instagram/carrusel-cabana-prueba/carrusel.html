<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel cabaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --sup:#11161C; --tx:#F6F1E7; --mut:#A9A79F; --verde:#34D399; --azul:#4C9AFF; --amar:#FFD60A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#222; font-family:'Inter',sans-serif; color:var(--tx); }
  .slide { width:1080px; height:1350px; background:var(--bg); position:relative; overflow:hidden;
           padding:110px 96px 0; display:flex; flex-direction:column; margin-bottom:40px; }
  h1,h2,.num { font-family:'Familjen Grotesk',sans-serif; letter-spacing:-0.03em; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:30px; color:var(--mut); font-weight:500; }
  .pill { border:2px solid #2A323C; border-radius:999px; padding:10px 26px; }
  .foot { position:absolute; left:96px; right:96px; bottom:80px; display:flex; justify-content:space-between; align-items:center; font-size:30px; color:var(--mut); }
  .foot svg { height:58px; width:auto; }
  /* portada */
  .cover h1 { font-size:150px; line-height:.95; font-weight:700; margin-top:150px; }
  .cover h1 em { font-style:normal; color:var(--verde); }
  .cover p { font-size:46px; line-height:1.25; margin-top:56px; color:var(--tx); max-width:820px; }
  .cover .swipe { margin-top:70px; font-size:34px; color:var(--amar); font-weight:600; }
  /* items */
  .item .box { width:150px; height:150px; border:8px solid var(--verde); border-radius:28px; margin-top:120px;
               display:flex; align-items:center; justify-content:center; }
  .item .box svg { width:96px; height:96px; }
  .item h2 { font-size:104px; line-height:1; font-weight:700; margin-top:80px; }
  .item p { font-size:44px; line-height:1.3; color:var(--mut); margin-top:56px; max-width:860px; }
  .item .num { position:absolute; right:60px; bottom:120px; font-size:520px; line-height:1; color:#141A21; font-weight:700; z-index:0; }
  .item > *:not(.num):not(.foot) { position:relative; z-index:1; }
  .foot { z-index:1; }
  ::-webkit-scrollbar { display:none; }
  html { scrollbar-width:none; }
  /* cierre */
  .close h1 { font-size:118px; line-height:1; font-weight:700; margin-top:150px; }
  .close h1 em { font-style:normal; color:var(--amar); }
  .close p { font-size:46px; line-height:1.3; margin-top:64px; max-width:860px; }
  .close .cta { margin-top:72px; display:inline-flex; align-self:flex-start; background:var(--verde); color:#000;
                font-weight:600; font-size:40px; padding:28px 48px; border-radius:999px; }
</style>
</head>
<body>
<template id="logo"><svg xmlns='http://www.w3.org/2000/svg' viewBox='216 334 770 434' role='img' aria-label='Soluciones DyS'><g fill='none' stroke-width='46' stroke-linecap='round' stroke-linejoin='round'><path d='M262 380 V650 H335 A135 135 0 0 0 335 380 Z' stroke='#34D399'/><path d='M545 500 L603 640 M661 500 L573 722' stroke='#F6F1E7'/><path d='M860 430 C830 380 740 385 735 440 C730 500 860 510 865 585 C870 650 770 665 735 610' stroke='#4C9AFF'/><circle cx='930' cy='639' r='34' fill='#FFD60A' stroke='none'/></g></svg></template>

<section class="slide cover">
  <div class="top"><span class="pill">Checklist para cabañas</span></div>
  <h1>¿Tu cabaña pasa la <em>prueba?</em></h1>
  <p>5 cosas que revisa un huésped antes de reservar.</p>
  <div class="swipe">Cuenta cuántas cumples →</div>
  <div class="foot"></div>
</section>

<script>
const items = [
  ['Fotos reales y actuales', 'Lo que ve en la foto es lo que espera encontrar al llegar.'],
  ['Precio claro', 'Según noches y número de huéspedes, sin tener que preguntar por mensaje.'],
  ['Disponibilidad al día', 'Un calendario desactualizado termina en una doble reserva.'],
  ['Cómo se reserva y cuánto se abona', 'Pasos claros antes de transferir un peso.'],
  ['Respuesta rápida por WhatsApp', 'Una duda sin respuesta es una reserva que se va a otra cabaña.'],
];
const check = "<svg viewBox='0 0 24 24' fill='none' stroke='#34D399' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>";
const cover = document.querySelector('.cover');
let prev = cover;
items.forEach(([t, d], i) => {
  const s = document.createElement('section');
  s.className = 'slide item';
  s.innerHTML = `<div class="top"><span class="pill">${i+1} de 5</span></div>
    <div class="box">${check}</div><h2>${t}</h2><p>${d}</p>
    <div class="num">${i+1}</div><div class="foot"></div>`;
  prev.after(s); prev = s;
});
const c = document.createElement('section');
c.className = 'slide close';
c.innerHTML = `<div class="top"><span class="pill">Antes de la temporada</span></div>
  <h1>Guárdalo y revísalo contra <em>tu cabaña.</em></h1>
  <p>¿Te fallan 2 o más? Escríbeme por DM y te cuento cómo resolverlas.</p>
  <div class="cta">Escríbeme por DM</div><div class="foot"></div>`;
prev.after(c);
const logo = document.getElementById('logo').innerHTML;
document.querySelectorAll('.foot').forEach(f => f.innerHTML = logo + '<span>@solucionesdys.cl</span>');
</script>
</body>
</html>
